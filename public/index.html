<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memento Pack</title>
    <meta name="description" content="Memento: a backpack that remembers what you carry and the traces your journeys leave behind." />
    <link rel="stylesheet" href="style.css" />
    <script defer src="vendor/p5-1.11.3.min.js"></script>
    <script defer src="sketch.js"></script>
    <script defer src="travel-data.js"></script>
    <script defer src="outer.js"></script>
    <script defer src="mobile.js"></script>
  </head>
  <body>
    <button id="phone-toggle" type="button" aria-label="Show phone preview" aria-pressed="false" title="Phone preview">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10 18.5h4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
    </button>
    <div id="device-shell">
    <div id="app-viewport">
    <nav id="view-switch" aria-label="Backpack view">
      <button type="button" data-view="outer" aria-pressed="false">Outer</button>
      <span aria-hidden="true">/</span>
      <button type="button" data-view="interior" aria-pressed="true">Interior</button>
    </nav>
    <aside id="travel-filters" aria-label="Filter travel marks" hidden>
      <label class="sr-only" for="country-filter">Country</label>
      <select id="country-filter"><option value="all">All countries</option></select>
      <div id="location-filter" role="group" aria-label="Location"></div>
    </aside>
    <aside id="history" aria-label="History log"></aside>
    <main>
      <h1 id="headline" aria-live="polite"></h1>
      <div id="canvas-container" role="img" aria-label="Isometric backpack placeholder: empty."></div>
      <div id="outer-container" hidden>
        <svg id="outer-pack" viewBox="0 0 800 700" aria-label="Closed backpack with interactive travel marks">
          <defs>
            <clipPath id="front-panel-clip"><rect x="0" y="0" width="280" height="370" rx="39" /></clipPath>
            <filter id="wear-soften" x="-60%" y="-100%" width="220%" height="300%"><feGaussianBlur stdDeviation="1.6" /></filter>
          </defs>
          <image href="assets/backpack-closed.svg" width="800" height="700" />
          <g transform="matrix(1 .2 0 1 250 140)" clip-path="url(#front-panel-clip)" id="travel-marks"></g>
        </svg>
      </div>
    </main>
    <nav id="dev-tools" aria-label="Setup tools">
      <button id="connect" type="button">connect</button>
      <span id="connection-status"></span>
    </nav>
    </div>
    </div>
    <div id="mark-tooltip" role="tooltip" hidden><span id="tooltip-place"></span><span id="tooltip-story"></span></div>
  </body>
</html>
